name: icloud-send
on:
  schedule:
    # Sat Nov 28 2026 Poland 45, 4-min gap (~3h): send from 06:30 UTC = 11:30 PKT. 3 start times in case GitHub's timer is late;
    # later runs queue behind the first and send nothing (already-sent emails are skipped).
    - cron: "0 4 28 11 *"
    - cron: "0 5 28 11 *"
    - cron: "0 6 28 11 *"
  workflow_dispatch:
    inputs:
      now:
        description: "send immediately (test)"
        default: "no"
      diag:
        description: "diagnostic self-test"
        default: "no"
      cap:
        description: "max emails"
        default: "40"
permissions:
  contents: write
concurrency: icloud-send
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: decrypt
        env: { QUEUE_KEY: "${{ secrets.QUEUE_KEY }}" }
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:QUEUE_KEY -in queue.csv.enc -out queue.csv
          [ -f sent.log.enc ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:QUEUE_KEY -in sent.log.enc -out sent.log || true
      - name: send
        env:
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_PASS: ${{ secrets.ICLOUD_PASS }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          CAP: ${{ github.event.inputs.cap || '45' }}
          SEND_AT: "06:30"
          GAP_MIN: "4.0"
          DIAG: ${{ github.event.inputs.diag == 'yes' && '1' || '0' }}
        run: |
          if [ "${{ github.event.inputs.now }}" = "yes" ]; then python3 server_send.py --now; else python3 server_send.py; fi
      - name: save log
        if: always()
        env: { QUEUE_KEY: "${{ secrets.QUEUE_KEY }}" }
        run: |
          [ -f sent.log ] && openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:QUEUE_KEY -in sent.log -out sent.log.enc || true
          rm -f queue.csv sent.log
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -m "log $(date -u +%F)" || true; for i in 1 2 3; do git pull --rebase -X theirs || true; git push && break || sleep 5; done
